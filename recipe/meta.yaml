{% set name = "ternary-diagram" %}
{% set version = "3.3.0" %}
{% set python_min = "3.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/ternary_diagram-{{ version }}.tar.gz
  sha256: ea7485d9ee5aad846e160db4ee10678e7553cf9513c7cc875545012c59f46e11

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - numpy >=1.20
    - matplotlib-base

test:
  imports:
    - ternary_diagram
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://github.com/yu9824/ternary-diagram/
  summary: This package makes it easier for you to draw beautiful ternary diagram without pymatgen.
  dev_url: http://github.com/yu9824/ternary-diagram/
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - yu9824
